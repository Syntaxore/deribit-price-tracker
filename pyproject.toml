[project]
name = "testtz"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "celery",
    "redis",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "aiohttp",
    "alembic",
    "pydantic-settings",
    "pydantic",
    "python-dotenv",
    "httpx",
    "celery-types>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]
